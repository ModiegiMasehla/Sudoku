[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku"
description = "A Sudoku solver, puzzle generator and terminal game."
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sudoku = "sudoku.cli:main"

[tool.setuptools.dynamic]
version = {attr = "sudoku.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
